[project]
name = "dubsub"
version = "0.1.1"
description = "Local AI-powered video dubbing pipeline"
requires-python = ">=3.12"
dependencies = [
    "ffmpeg-python>=0.2.0",
    "openai-whisper>=20231117",
    "argostranslate>=1.9.0",
    "piper-tts>=1.2.0",
    "pysubs2>=1.7.0",
    "pydub>=0.25.1",
    "fastapi>=0.135.3",
    "uvicorn>=0.44.0",
    "python-multipart>=0.0.26",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
dubsub = "dubsub:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
